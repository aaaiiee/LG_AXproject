[project]
name = "lg_dash"
version = "0.0.1"
description = "Korean home appliance comparison dashboard (washer / dryer / top-loader)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "pillow>=10.4",
    "plotly>=5.22",
    "streamlit>=1.36",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "crawl4ai>=0.4",
    "python-dotenv>=1.0",
]

[project.scripts]
lg-dash-seed = "lg_dash.scripts.seed_brands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lg_dash"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
